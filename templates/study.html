<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study {{ deck }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
<p><a href="{{ url_for('home') }}">All decks</a></p>
<h1>{{ deck }}</h1>

{% if message %}<p class="message">{{ message }}</p>{% endif %}

{% if card %}
<p class="lead">{{ left }} card{{ 's' if left > 1 }} due. This one is in box {{ card.box }}.</p>
<div class="card">
  <p class="front">{{ card.front }}</p>
  <details>
    <summary>Show the answer</summary>
    <div class="back">{{ card.back }}</div>
    <div class="answers">
      <form method="post" action="{{ url_for('answer', card_id=card.card_id) }}">
        <input type="hidden" name="knew_it" value="yes"><button class="button" type="submit">I knew it</button>
      </form>
      <form method="post" action="{{ url_for('answer', card_id=card.card_id) }}">
        <input type="hidden" name="knew_it" value="no"><button class="button miss" type="submit">I did not</button>
      </form>
    </div>
  </details>
</div>
{% else %}
<p>Nothing is due in this deck today.</p>
{% endif %}
</main>
</body>
</html>
